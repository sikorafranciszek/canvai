# canvai — wdrożenie przez Coolify (build pack: Docker Compose).
# Domenę (https://app.canvai.dev) ustawia się w Coolify na usłudze `app`;
# SERVICE_FQDN_APP_3333 mówi Coolify, że aplikacja słucha na porcie 3333.
# Zmienne z ${...} są edytowalne w Coolify → Environment Variables.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_APP_3333
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3333
      - TZ=UTC
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Losowy sekret generowany przez Coolify przy pierwszym wdrożeniu.
      - APP_KEY=${SERVICE_PASSWORD_64_APPKEY}
      - APP_URL=${APP_URL:-https://app.canvai.dev}
      - SESSION_DRIVER=cookie
      # Baza aplikacji: PostgreSQL (usługa `postgres` niżej).
      - DB_CONNECTION=pg
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=canvai
      - DB_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - DB_DATABASE=canvai
      # Stary plik SQLite — jednorazowy import do Postgresa przy pierwszym starcie.
      - SQLITE_PATH=/app/data/db.sqlite3
      - STORAGE_PATH=/app/data/storage
      - TRUST_PROXY=true
      # AI: deepseek + DEEPSEEK_API_KEY. Bez klucza aplikacja nie wystartuje (REL-3);
      # atrapa `mock` tylko świadomie: AI_PROVIDER=mock + ALLOW_MOCK_AI=true.
      - AI_PROVIDER=${AI_PROVIDER:-deepseek}
      - ALLOW_MOCK_AI=${ALLOW_MOCK_AI:-false}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_THINKING=${DEEPSEEK_THINKING:-off}
      # Równoległe generacje w workerze (+ osobny tor podglądów).
      - QUEUE_CONCURRENCY=${QUEUE_CONCURRENCY:-3}
      # Poczta (weryfikacja kont, reset hasła): resend + RESEND_API_KEY albo smtp + SMTP_*.
      - MAIL_MAILER=${MAIL_MAILER:-resend}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-canvai}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-no-reply@canvai.dev}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      # Rozliczenia (Polar.sh) — bez tokenu sprzedaż jest wyłączona, limity planów działają.
      - BILLING_ENFORCED=${BILLING_ENFORCED:-true}
      - POLAR_ACCESS_TOKEN=${POLAR_ACCESS_TOKEN:-}
      - POLAR_WEBHOOK_SECRET=${POLAR_WEBHOOK_SECRET:-}
      - POLAR_SERVER=${POLAR_SERVER:-production}
      - POLAR_PRODUCT_PACK_S=${POLAR_PRODUCT_PACK_S:-}
      - POLAR_PRODUCT_PACK_M=${POLAR_PRODUCT_PACK_M:-}
      - POLAR_PRODUCT_PACK_L=${POLAR_PRODUCT_PACK_L:-}
      - POLAR_PRODUCT_PRO=${POLAR_PRODUCT_PRO:-}
      - POLAR_PRODUCT_TEAM=${POLAR_PRODUCT_TEAM:-}
      - POLAR_PRODUCT_AGENCY=${POLAR_PRODUCT_AGENCY:-}
      # Analityka i logi (ClickHouse w tym samym stosie) + panel CRM.
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USER=canvai
      - CLICKHOUSE_PASSWORD=${SERVICE_PASSWORD_CLICKHOUSE}
      - CLICKHOUSE_DB=canvai
      - CRM_HOST=${CRM_HOST:-crm.canvai.dev}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      # Kopie zapasowe (codziennie: pg_dump + pliki) do bucketu S3/R2; puste = wyłączone.
      - BACKUP_S3_ENDPOINT=${BACKUP_S3_ENDPOINT:-}
      - BACKUP_S3_REGION=${BACKUP_S3_REGION:-auto}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET:-}
      - BACKUP_S3_ACCESS_KEY_ID=${BACKUP_S3_ACCESS_KEY_ID:-}
      - BACKUP_S3_SECRET_ACCESS_KEY=${BACKUP_S3_SECRET_ACCESS_KEY:-}
      - BACKUP_S3_PREFIX=${BACKUP_S3_PREFIX:-canvai/}
      - BACKUP_HOUR_UTC=${BACKUP_HOUR_UTC:-3}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-14}
      # Alerty (błędy serwera, nieudane generacje i kopie): mail do ADMIN_EMAILS + webhook Slack/Discord.
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      # Monitoring: /health/deep (worker, kolejka, dysk, kopie). Token odsłania szczegóły.
      - HEALTH_TOKEN=${HEALTH_TOKEN:-}
      # Bezpieczniki kosztów AI (dziennie): globalnie i na konto.
      - AI_DAILY_TOKEN_BUDGET=${AI_DAILY_TOKEN_BUDGET:-30000000}
      - AI_USER_DAILY_GENERATIONS=${AI_USER_DAILY_GENERATIONS:-40}
      - AI_USER_DAILY_TOKENS=${AI_USER_DAILY_TOKENS:-3000000}
      # Microsoft Clarity (tylko po zgodzie użytkownika) — projekt app.canvai.dev.
      - CLARITY_PROJECT_ID=${CLARITY_PROJECT_ID:-yqij10mk35}
    volumes:
      - canvai-data:/app/data
    # Czas na dokończenie / oddanie bieżącej generacji przy wdrożeniu.
    stop_grace_period: 30s
    # Limity zasobów (REL-3): jeden proces nie zajmie całego serwera.
    mem_limit: ${APP_MEM_LIMIT:-2g}
    cpus: ${APP_CPUS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      # Aplikacja działa także bez ClickHouse (analityka buforuje się i czeka).
      clickhouse:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Główna baza aplikacji — tylko sieć wewnętrzna stosu, dane na wolumenie.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=canvai
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=canvai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    stop_grace_period: 30s
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    cpus: ${POSTGRES_CPUS:-1}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canvai -d canvai"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Analityka produktu, żądania HTTP i logi (panel CRM: crm.canvai.dev).
  # Tylko sieć wewnętrzna stosu — bez portów na zewnątrz.
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    environment:
      - CLICKHOUSE_DB=canvai
      - CLICKHOUSE_USER=canvai
      - CLICKHOUSE_PASSWORD=${SERVICE_PASSWORD_CLICKHOUSE}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=0
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./docker/clickhouse/low-memory.xml:/etc/clickhouse-server/config.d/canvai.xml:ro
      - ./docker/clickhouse/users.xml:/etc/clickhouse-server/users.d/canvai.xml:ro
    stop_grace_period: 30s
    mem_limit: ${CLICKHOUSE_MEM_LIMIT:-2g}
    cpus: ${CLICKHOUSE_CPUS:-1}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user canvai --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  canvai-data:
  postgres-data:
  clickhouse-data:
